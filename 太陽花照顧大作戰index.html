<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽花照顧大作戰 🌻</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for storybook aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFFDE8;
            background-image: 
                radial-gradient(#FDE68A 1.8px, transparent 1.8px), 
                radial-gradient(#FDE68A 1.8px, #FFFDE8 1.8px);
            background-size: 48px 48px;
            background-position: 0 0, 24px 24px;
        }

        .card-storybook {
            background: #FFFFFF;
            border: 4px solid #FDE68A;
            box-shadow: 0 12px 28px -6px rgba(217, 119, 6, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
        }

        .btn-action {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-bottom-width: 6px;
        }
        .btn-action:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .btn-action:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 2px;
        }

        /* Sun emergence animation */
        .sun-appear {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
        }

        /* Plant growth bounce animation */
        .plant-bounce {
            animation: plantBounce 0.8s cubic-bezier(0.36, 0, 0.66, -0.56);
        }

        @keyframes plantBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.18, 0.82); }
            60% { transform: scale(0.9, 1.12); }
            80% { transform: scale(1.05, 0.95); }
            100% { transform: scale(1); }
        }

        /* Gentle idle sway for plant */
        @keyframes gentleSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        .animate-sway {
            transform-origin: bottom center;
            animation: gentleSway 3.5s ease-in-out infinite;
        }

        /* Sun glow rotation */
        @keyframes sunPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(15deg); }
        }
        .animate-sun-pulse {
            transform-origin: center;
            animation: sunPulse 6s ease-in-out infinite;
        }

        /* WATERING CAN POURING ANIMATION (SPOUT FACING LEFT, TILTING DOWNWARDS-LEFT) */
        @keyframes pourWaterCanLeft {
            0% {
                opacity: 0;
                transform: translate(30px, -20px) rotate(0deg) scale(0.85);
            }
            20% {
                opacity: 1;
                transform: translate(0, 0) rotate(36deg) scale(1);
            }
            75% {
                opacity: 1;
                transform: translate(0, 0) rotate(36deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(15px, -10px) rotate(0deg) scale(0.9);
            }
        }
        .animate-watering-can-left {
            animation: pourWaterCanLeft 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* WIND BREEZE SWEEP ANIMATION */
        @keyframes breezeSweep {
            0% {
                opacity: 0;
                transform: translateX(-40px) scaleX(0.7);
            }
            30% {
                opacity: 0.9;
                transform: translateX(0px) scaleX(1);
            }
            70% {
                opacity: 0.9;
                transform: translateX(40px) scaleX(1);
            }
            100% {
                opacity: 0;
                transform: translateX(80px) scaleX(0.8);
            }
        }
        .animate-breeze {
            animation: breezeSweep 1.6s ease-out forwards;
        }

        /* Canvas overlays */
        #effectsCanvas {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 2rem;
            z-index: 20;
        }
    </style>
</head>
<body class="min-h-screen text-amber-950 flex flex-col justify-between p-3 sm:p-6 select-none">

    <!-- Title Header -->
    <header class="max-w-5xl mx-auto w-full text-center my-2 sm:my-3">
        <div class="inline-flex items-center gap-2 sm:gap-3 bg-amber-100/90 border-4 border-amber-300 px-5 py-2.5 rounded-full shadow-md backdrop-blur-sm">
            <span class="text-3xl sm:text-4xl animate-bounce">🌻</span>
            <h1 class="text-2xl sm:text-3xl font-black tracking-wide text-amber-900" style="font-family: 'Mochiy Pop One', 'Noto Sans TC', sans-serif;">
                太陽花照顧大作戰
            </h1>
            <span class="text-3xl sm:text-4xl animate-bounce">☀️</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 my-auto items-stretch">
        
        <!-- ================= LEFT: MAIN FLOWER GROWTH STAGE ================= -->
        <section class="lg:col-span-7 flex flex-col justify-between card-storybook p-4 sm:p-6 relative overflow-hidden bg-gradient-to-b from-sky-100 via-sky-50 to-amber-50">
            
            <!-- Effects Overlay Canvas -->
            <canvas id="effectsCanvas"></canvas>

            <!-- Stage Progress Badges Top Bar -->
            <div class="w-full bg-white/85 backdrop-blur-md rounded-2xl p-2.5 border-2 border-amber-200 shadow-sm z-10 flex justify-between items-center gap-1">
                <div id="step-0" class="step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-400 text-amber-950 shadow-sm border-2 border-amber-500 scale-105">
                    <span class="block text-base sm:text-xl">🌱</span>
                    <span>1. 發芽</span>
                </div>
                <div class="text-amber-300 font-bold text-xs">➔</div>
                <div id="step-1" class="step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-100/60 text-amber-600/70">
                    <span class="block text-base sm:text-xl">🌿</span>
                    <span>2. 幼苗</span>
                </div>
                <div class="text-amber-300 font-bold text-xs">➔</div>
                <div id="step-2" class="step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-100/60 text-amber-600/70">
                    <span class="block text-base sm:text-xl">🪴</span>
                    <span>3. 成長中</span>
                </div>
                <div class="text-amber-300 font-bold text-xs">➔</div>
                <div id="step-3" class="step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-100/60 text-amber-600/70">
                    <span class="block text-base sm:text-xl">🌻</span>
                    <span>4. 盛開</span>
                </div>
            </div>

            <!-- Central Garden Scene -->
            <div class="relative w-full h-64 sm:h-80 my-3 flex items-center justify-center">
                
                <!-- 1. SUN ELEMENT -->
                <div id="sun-element" class="sun-appear absolute top-1 right-4 sm:right-8 z-10 opacity-0 scale-50 pointer-events-none">
                    <div class="relative flex items-center justify-center">
                        <div class="absolute w-24 h-24 sm:w-28 sm:h-28 bg-amber-300/40 rounded-full blur-md animate-pulse"></div>
                        <svg class="w-16 h-16 sm:w-22 sm:h-22 text-amber-400 animate-sun-pulse" viewBox="0 0 100 100" fill="currentColor">
                            <circle cx="50" cy="50" r="24" fill="#FBBF24" stroke="#F59E0B" stroke-width="3"/>
                            <g stroke="#F59E0B" stroke-width="6" stroke-linecap="round">
                                <line x1="50" y1="10" x2="50" y2="18" />
                                <line x1="50" y1="82" x2="50" y2="90" />
                                <line x1="10" y1="50" x2="18" y2="50" />
                                <line x1="82" y1="50" x2="90" y2="50" />
                                <line x1="22" y1="22" x2="28" y2="28" />
                                <line x1="72" y1="72" x2="78" y2="78" />
                                <line x1="22" y1="78" x2="28" y2="72" />
                                <line x1="72" y1="28" x2="78" y2="22" />
                            </g>
                        </svg>
                    </div>
                </div>

                <!-- 2. AIR / BREEZE EFFECT ANIMATION -->
                <div id="air-element" class="absolute top-12 left-4 sm:left-10 z-10 opacity-0 pointer-events-none">
                    <svg class="w-32 h-16 text-cyan-400/90" viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
                        <path d="M 10 20 Q 40 5 70 20 T 110 20 A 8 8 0 0 0 105 8" />
                        <path d="M 25 38 Q 55 25 80 38 T 115 38" stroke-width="3" />
                        <path d="M 5 48 Q 25 40 45 48" stroke-width="2.5" />
                    </svg>
                </div>

                <!-- 3. WATERING CAN ANIMATION CONTAINER -->
                <div id="watering-can-container" class="absolute top-2 right-6 sm:right-16 z-30 opacity-0 pointer-events-none">
                    <div class="relative">
                        <svg class="w-24 h-20 sm:w-28 sm:h-24 drop-shadow-md" viewBox="0 0 120 100">
                            <path d="M 90 40 C 110 30 110 70 90 65" fill="none" stroke="#0284C7" stroke-width="7" stroke-linecap="round"/>
                            <path d="M 50 35 L 90 35 C 98 35 100 45 95 75 C 93 82 85 85 45 85 C 37 85 39 75 40 45 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="4" stroke-linejoin="round"/>
                            <ellipse cx="70" cy="35" rx="20" ry="5" fill="#7DD3FC" stroke="#0284C7" stroke-width="3"/>
                            <circle cx="68" cy="60" r="8" fill="#FDE047"/>
                            <path d="M 48 55 L 22 35" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>
                            <path d="M 48 55 L 22 35" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
                            <path d="M 25 28 L 12 42 L 18 46 L 31 32 Z" fill="#0284C7"/>
                            <ellipse cx="17" cy="39" rx="3" ry="8" fill="#E0F2FE" transform="rotate(35 17 39)"/>
                        </svg>
                    </div>
                </div>

                <!-- Sunlight Warm Overlay Layer -->
                <div id="sun-light-beam" class="absolute inset-0 bg-amber-300/10 pointer-events-none opacity-0 transition-opacity duration-500 rounded-2xl"></div>

                <!-- Dynamic Sunflower Plant SVG Canvas -->
                <svg id="sunflowerSVG" class="w-full h-full max-h-72 z-0" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
                    
                    <!-- Soil / Pot Mound Base -->
                    <g id="soil-base">
                        <ellipse cx="150" cy="265" rx="90" ry="18" fill="#78350F" opacity="0.2"/>
                        <path d="M 80 250 Q 150 230 220 250 L 210 275 Q 150 285 90 275 Z" fill="#92400E" stroke="#451A03" stroke-width="4" stroke-linejoin="round"/>
                        <ellipse id="soil-surface" cx="150" cy="250" rx="70" ry="12" fill="#B45309" class="transition-colors duration-500"/>
                    </g>

                    <!-- STAGE 0: Sprouts (發芽) -->
                    <g id="plant-stage-0" class="plant-stage opacity-100 scale-100 transition-all duration-500">
                        <path d="M 150 250 Q 150 225 150 215" stroke="#16A34A" stroke-width="6" stroke-linecap="round" fill="none"/>
                        <path id="sprout-leaf-1" d="M 150 218 Q 135 200 120 210 Q 135 225 150 218" fill="#4ADE80" stroke="#16A34A" stroke-width="2"/>
                        <path id="sprout-leaf-2" d="M 150 218 Q 165 200 180 210 Q 165 225 150 218" fill="#4ADE80" stroke="#16A34A" stroke-width="2"/>
                        <circle cx="146" cy="225" r="1.5" fill="#064E3B"/>
                        <circle cx="154" cy="225" r="1.5" fill="#064E3B"/>
                    </g>

                    <!-- STAGE 1: Seedling (幼苗) -->
                    <g id="plant-stage-1" class="plant-stage opacity-0 scale-75 pointer-events-none transition-all duration-500">
                        <path d="M 150 250 Q 148 210 150 170" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
                        <path d="M 150 220 Q 120 210 105 225 Q 125 240 150 225" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
                        <path d="M 150 220 Q 180 210 195 225 Q 175 240 150 225" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
                        <path d="M 150 185 Q 128 170 115 180 Q 130 198 150 188" fill="#4ADE80" stroke="#16A34A" stroke-width="3"/>
                        <path d="M 150 185 Q 172 170 185 180 Q 170 198 150 188" fill="#4ADE80" stroke="#16A34A" stroke-width="3"/>
                    </g>

                    <!-- STAGE 2: Growing Bud (成長中) -->
                    <g id="plant-stage-2" class="plant-stage opacity-0 scale-75 pointer-events-none transition-all duration-500 animate-sway">
                        <path d="M 150 250 Q 152 180 150 120" stroke="#15803D" stroke-width="10" stroke-linecap="round" fill="none"/>
                        <path d="M 150 210 Q 110 190 90 215 Q 120 235 150 215" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
                        <path d="M 150 210 Q 190 190 210 215 Q 180 235 150 215" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
                        <path d="M 150 155 Q 118 135 102 155 Q 125 175 150 160" fill="#4ADE80" stroke="#16A34A" stroke-width="3"/>
                        <path d="M 150 155 Q 182 135 198 155 Q 175 175 150 160" fill="#4ADE80" stroke="#16A34A" stroke-width="3"/>
                        <path d="M 150 120 C 130 110 135 80 150 75 C 165 80 170 110 150 120 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="3"/>
                        <path d="M 150 125 Q 135 110 138 95" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 150 125 Q 165 110 162 95" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
                    </g>

                    <!-- STAGE 3: Blooming Sunflower (盛開) -->
                    <g id="plant-stage-3" class="plant-stage opacity-0 scale-75 pointer-events-none transition-all duration-500 animate-sway">
                        <path d="M 150 250 Q 148 180 150 115" stroke="#15803D" stroke-width="12" stroke-linecap="round" fill="none"/>
                        <path d="M 150 200 Q 100 180 80 205 Q 115 230 150 205" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
                        <path d="M 150 200 Q 200 180 220 205 Q 185 230 150 205" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
                        
                        <g transform="translate(150, 100)">
                            <!-- Rotating Petals -->
                            <g fill="#FBBF24" stroke="#D97706" stroke-width="2">
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(30)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(60)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(90)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(120)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(150)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(180)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(210)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(240)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(270)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(300)" />
                                <path d="M 0 0 C -15 -35 -10 -60 0 -70 C 10 -60 15 -35 0 0" transform="rotate(330)" />
                            </g>
                            <!-- Seed Disc Center -->
                            <circle cx="0" cy="0" r="34" fill="#78350F" stroke="#451A03" stroke-width="4"/>
                            <circle cx="0" cy="0" r="28" fill="#92400E" stroke-dasharray="4,3" stroke="#B45309" stroke-width="3"/>
                            <!-- Face -->
                            <circle cx="-12" cy="-5" r="4.5" fill="#FEF3C7"/>
                            <circle cx="-12" cy="-5" r="3" fill="#1C1917"/>
                            <circle cx="12" cy="-5" r="4.5" fill="#FEF3C7"/>
                            <circle cx="12" cy="-5" r="3" fill="#1C1917"/>
                            <path d="M -8 8 Q 0 16 8 8" fill="none" stroke="#FEF3C7" stroke-width="3.5" stroke-linecap="round"/>
                            <circle cx="-18" cy="5" r="4" fill="#F43F5E" opacity="0.6"/>
                            <circle cx="18" cy="5" r="4" fill="#F43F5E" opacity="0.6"/>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- Formula Bar at Bottom of Garden Box -->
            <div class="bg-amber-100/90 border-2 border-amber-300 rounded-2xl p-2.5 z-10 flex flex-wrap items-center justify-center gap-2 text-center shadow-inner">
                <div class="inline-flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl border border-amber-200 font-bold text-amber-900 text-sm">
                    <span id="eq-sun" class="text-xl opacity-30 transition-all scale-90">☀️</span>
                    <span class="text-amber-400 font-extrabold">+</span>
                    <span id="eq-air" class="text-xl opacity-30 transition-all scale-90">💨</span>
                    <span class="text-amber-400 font-extrabold">+</span>
                    <span id="eq-water" class="text-xl opacity-30 transition-all scale-90">💧</span>
                </div>
                <span class="font-black text-amber-800 text-lg">=</span>
                <div class="inline-flex items-center gap-1 bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-xl border border-amber-500 font-black text-sm shadow-sm">
                    <span>🌻 生長</span>
                </div>
                <span id="status-hint" class="w-full text-xs font-bold text-amber-800/80 mt-0.5">
                    未給予陽光！點擊「☀️ 陽光」讓太陽出現！
                </span>
            </div>
        </section>

        <!-- ================= RIGHT: CONTROLS & CHECKLIST ================= -->
        <section class="lg:col-span-5 flex flex-col justify-between gap-4">
            
            <!-- 1. 生長條件 (置頂) -->
            <div class="card-storybook p-5 bg-gradient-to-br from-amber-50 to-orange-50">
                <div class="flex items-center justify-between mb-3 border-b-2 border-amber-200/60 pb-2">
                    <h3 class="text-base font-black text-amber-900 flex items-center gap-2">
                        <span>📋</span> 生長條件 :
                    </h3>
                    <span id="checklist-counter" class="text-xs font-black text-amber-800 bg-amber-200/80 px-2.5 py-1 rounded-full">0 / 3 滿足</span>
                </div>

                <div class="space-y-2.5">
                    <!-- Sun Item -->
                    <div id="check-sun" class="flex items-center justify-between p-3 rounded-xl bg-white border-2 border-amber-200/80 transition-all">
                        <div class="flex items-center gap-2.5 font-bold text-amber-900 text-sm sm:text-base">
                            <span class="text-xl">☀️</span>
                            <span>陽光養分</span>
                        </div>
                        <span class="status-icon bg-amber-100 text-amber-700 text-xs font-extrabold px-2.5 py-1 rounded-lg border border-amber-300 flex items-center gap-1">
                            <span>❌ 未滿足</span>
                        </span>
                    </div>

                    <!-- Air Item -->
                    <div id="check-air" class="flex items-center justify-between p-3 rounded-xl bg-white border-2 border-amber-200/80 transition-all">
                        <div class="flex items-center gap-2.5 font-bold text-amber-900 text-sm sm:text-base">
                            <span class="text-xl">💨</span>
                            <span>空氣對流</span>
                        </div>
                        <span class="status-icon bg-amber-100 text-amber-700 text-xs font-extrabold px-2.5 py-1 rounded-lg border border-amber-300 flex items-center gap-1">
                            <span>❌ 未滿足</span>
                        </span>
                    </div>

                    <!-- Water Item -->
                    <div id="check-water" class="flex items-center justify-between p-3 rounded-xl bg-white border-2 border-amber-200/80 transition-all">
                        <div class="flex items-center gap-2.5 font-bold text-amber-900 text-sm sm:text-base">
                            <span class="text-xl">💧</span>
                            <span>充足水分</span>
                        </div>
                        <span class="status-icon bg-amber-100 text-amber-700 text-xs font-extrabold px-2.5 py-1 rounded-lg border border-amber-300 flex items-center gap-1">
                            <span>❌ 未滿足</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- 2. 選擇養分 (置底) -->
            <div class="card-storybook p-5 flex flex-col gap-3">
                <div class="flex items-center justify-between border-b-2 border-amber-100 pb-2">
                    <h2 class="text-lg font-black text-amber-900 flex items-center gap-2">
                        <span>🧪</span> 選擇養分 :
                    </h2>
                    <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">點擊給予</span>
                </div>

                <!-- 1. Sun Button -->
                <button id="btn-sun" onclick="feedElement('sun')" class="btn-action w-full bg-amber-400 hover:bg-amber-300 active:bg-amber-500 border-amber-600 text-amber-950 font-black text-lg py-3 px-4 rounded-2xl shadow-md flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl group-hover:scale-125 transition-transform">☀️</span>
                        <div class="text-left">
                            <span class="block leading-tight">陽光</span>
                            <span class="text-xs font-bold opacity-75">Sunlight</span>
                        </div>
                    </div>
                    <span class="bg-amber-100 text-amber-900 text-xs px-3 py-1.5 rounded-xl font-bold border border-amber-300">給予 +1</span>
                </button>

                <!-- 2. Air Button -->
                <button id="btn-air" onclick="feedElement('air')" class="btn-action w-full bg-cyan-200 hover:bg-cyan-100 active:bg-cyan-300 border-cyan-500 text-cyan-950 font-black text-lg py-3 px-4 rounded-2xl shadow-md flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl group-hover:scale-125 transition-transform">💨</span>
                        <div class="text-left">
                            <span class="block leading-tight">空氣</span>
                            <span class="text-xs font-bold opacity-75">Fresh Air</span>
                        </div>
                    </div>
                    <span class="bg-cyan-50 text-cyan-900 text-xs px-3 py-1.5 rounded-xl font-bold border border-cyan-300">通風 +1</span>
                </button>

                <!-- 3. Water Button -->
                <button id="btn-water" onclick="feedElement('water')" class="btn-action w-full bg-sky-400 hover:bg-sky-300 active:bg-sky-500 border-sky-600 text-white font-black text-lg py-3 px-4 rounded-2xl shadow-md flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl group-hover:scale-125 transition-transform">💧</span>
                        <div class="text-left">
                            <span class="block leading-tight">水</span>
                            <span class="text-xs font-bold opacity-90">Water</span>
                        </div>
                    </div>
                    <span class="bg-sky-100 text-sky-900 text-xs px-3 py-1.5 rounded-xl font-bold border border-sky-300">澆水 +1</span>
                </button>
            </div>

            <!-- Controls Bar -->
            <div class="flex justify-between items-center gap-3">
                <button onclick="toggleAudio()" id="btn-audio" class="flex-1 bg-white hover:bg-amber-50 border-2 border-amber-300 text-amber-900 font-bold py-2.5 px-4 rounded-xl shadow-sm transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                    <span id="audio-icon">🔊</span> <span id="audio-text">音效: 開</span>
                </button>
                <button onclick="resetGame()" class="flex-1 bg-amber-200 hover:bg-amber-300 border-2 border-amber-400 text-amber-950 font-bold py-2.5 px-4 rounded-xl shadow-sm transition-all text-xs sm:text-sm flex items-center justify-center gap-2">
                    <span>🔄</span> 重頭開始
                </button>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="max-w-5xl mx-auto w-full text-center text-xs text-amber-800/60 my-2 font-medium">
        🌻 太陽花照顧大作戰 • 集齊 ☀️ 陽光 + 💨 空氣 + 💧 水 才能長大！
    </footer>

    <!-- Victory Modal -->
    <div id="victoryModal" class="fixed inset-0 bg-amber-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white border-4 border-amber-400 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 relative overflow-hidden" id="victoryCard">
            <div class="text-6xl sm:text-7xl my-2 animate-bounce">🌻</div>
            <h2 class="text-2xl sm:text-3xl font-black text-amber-900 mb-2" style="font-family: 'Mochiy Pop One', sans-serif;">
                恭喜盛開！🎉
            </h2>
            <p class="text-amber-800 font-bold text-sm sm:text-base mb-6">
                太棒了！在你細心的照料下，提供充足的陽光、空氣與水，太陽花完美盛開囉！
            </p>
            <button onclick="resetGame(); closeVictoryModal();" class="w-full bg-amber-400 hover:bg-amber-300 border-b-4 border-amber-600 text-amber-950 font-black text-lg py-3 px-6 rounded-2xl shadow-lg transition-transform active:scale-95">
                🔄 再玩一次
            </button>
        </div>
    </div>

    <script>
        /* Game State Variables */
        let currentStage = 0; // 0: 發芽, 1: 幼苗, 2: 成長中, 3: 盛開
        const conditions = {
            sun: false,
            air: false,
            water: false
        };
        let soundEnabled = true;

        /* Web Audio API Synthesizer */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;

            if (type === 'sun') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0, now + idx * 0.05);
                    gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.05 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.3);
                });
            } else if (type === 'air') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.18);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.4);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.16, now + 0.18);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'water') {
                for (let i = 0; i < 6; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    const delay = i * 0.12;
                    const freq = 400 + Math.random() * 500;
                    osc.frequency.setValueAtTime(freq, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(freq + 300, now + delay + 0.08);

                    gain.gain.setValueAtTime(0.15, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.11);
                }
            } else if (type === 'grow') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.32);
                });
            } else if (type === 'victory') {
                const fanfare = [
                    {f: 523.25, d: 0.12, t: 0},
                    {f: 659.25, d: 0.12, t: 0.12},
                    {f: 783.99, d: 0.12, t: 0.24},
                    {f: 1046.5, d: 0.4, t: 0.38}
                ];
                fanfare.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note.f, now + note.t);
                    gain.gain.setValueAtTime(0.25, now + note.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + note.t);
                    osc.stop(now + note.t + note.d + 0.05);
                });
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('audio-icon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('audio-text').innerText = soundEnabled ? '音效: 開' : '音效: 關';
        }

        function feedElement(type) {
            if (currentStage >= 3 && conditions.sun && conditions.air && conditions.water) return;

            conditions[type] = true;
            playSound(type);

            if (type === 'sun') {
                updateSceneEffects();
                spawnParticles('sun');
            } else if (type === 'air') {
                triggerAirAnimation();
                spawnParticles('air');
            } else if (type === 'water') {
                triggerWateringCanAnimation();
                spawnParticles('water');
            }

            updateChecklistUI();
            checkStageProgress();
        }

        function updateSceneEffects() {
            const sunElem = document.getElementById('sun-element');
            const sunBeam = document.getElementById('sun-light-beam');

            if (conditions.sun) {
                sunElem.classList.remove('opacity-0', 'scale-50', 'pointer-events-none');
                sunElem.classList.add('opacity-100', 'scale-100');
                sunBeam.classList.remove('opacity-0');
                sunBeam.classList.add('opacity-100');
            } else {
                sunElem.classList.remove('opacity-100', 'scale-100');
                sunElem.classList.add('opacity-0', 'scale-50', 'pointer-events-none');
                sunBeam.classList.remove('opacity-100');
                sunBeam.classList.add('opacity-0');
            }
        }

        function triggerWateringCanAnimation() {
            const can = document.getElementById('watering-can-container');
            const soilSurface = document.getElementById('soil-surface');

            can.classList.remove('animate-watering-can-left');
            void can.offsetWidth;
            can.classList.add('animate-watering-can-left');

            soilSurface.setAttribute('fill', '#78350F');
        }

        function triggerAirAnimation() {
            const breeze = document.getElementById('air-element');
            breeze.classList.remove('animate-breeze');
            void breeze.offsetWidth;
            breeze.classList.add('animate-breeze');
        }

        function updateChecklistUI() {
            const types = ['sun', 'air', 'water'];
            let count = 0;

            types.forEach(t => {
                const item = document.getElementById(`check-${t}`);
                const iconSpan = item.querySelector('.status-icon');
                const eqIcon = document.getElementById(`eq-${t}`);

                if (conditions[t]) {
                    count++;
                    item.className = "flex items-center justify-between p-3 rounded-xl bg-emerald-50 border-2 border-emerald-400 shadow-sm transition-all";
                    iconSpan.className = "status-icon bg-emerald-500 text-white text-xs font-extrabold px-2.5 py-1 rounded-lg border border-emerald-600 flex items-center gap-1 shadow-sm";
                    iconSpan.innerHTML = "<span>✅ 已滿足</span>";
                    
                    eqIcon.classList.remove('opacity-30', 'scale-90');
                    eqIcon.classList.add('opacity-100', 'scale-110');
                } else {
                    item.className = "flex items-center justify-between p-3 rounded-xl bg-white border-2 border-amber-200/80 transition-all";
                    iconSpan.className = "status-icon bg-amber-100 text-amber-700 text-xs font-extrabold px-2.5 py-1 rounded-lg border border-amber-300 flex items-center gap-1";
                    iconSpan.innerHTML = "<span>❌ 未滿足</span>";

                    eqIcon.classList.add('opacity-30', 'scale-90');
                    eqIcon.classList.remove('opacity-100', 'scale-110');
                }
            });

            document.getElementById('checklist-counter').innerText = `${count} / 3 滿足`;

            const statusHint = document.getElementById('status-hint');
            if (count === 3) {
                statusHint.innerText = "✨ 三要素齊備！太陽花即將長大！";
                statusHint.className = "w-full text-xs font-extrabold text-emerald-700 mt-0.5 animate-pulse";
            } else {
                let missingStr = [];
                if (!conditions.sun) missingStr.push("☀️ 陽光");
                if (!conditions.air) missingStr.push("💨 空氣");
                if (!conditions.water) missingStr.push("💧 水");
                statusHint.innerText = `還缺少：${missingStr.join("、")}，三要素齊備才能長大！`;
                statusHint.className = "w-full text-xs font-bold text-amber-800/80 mt-0.5";
            }
        }

        function checkStageProgress() {
            if (conditions.sun && conditions.air && conditions.water) {
                setTimeout(() => {
                    if (currentStage < 3) {
                        currentStage++;
                        advanceStage(currentStage);
                    }
                }, 600);
            }
        }

        function advanceStage(newStage) {
            playSound('grow');

            conditions.sun = false;
            conditions.air = false;
            conditions.water = false;

            document.getElementById('soil-surface').setAttribute('fill', '#B45309');
            updateSceneEffects();

            for (let i = 0; i < 4; i++) {
                const stageElem = document.getElementById(`plant-stage-${i}`);
                if (i === newStage) {
                    stageElem.classList.remove('opacity-0', 'scale-75', 'pointer-events-none');
                    stageElem.classList.add('opacity-100', 'scale-100', 'plant-bounce');
                    setTimeout(() => stageElem.classList.remove('plant-bounce'), 800);
                } else {
                    stageElem.classList.remove('opacity-100', 'scale-100', 'plant-bounce');
                    stageElem.classList.add('opacity-0', 'scale-75', 'pointer-events-none');
                }
            }

            for (let i = 0; i < 4; i++) {
                const stepElem = document.getElementById(`step-${i}`);
                if (i === newStage) {
                    stepElem.className = "step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-400 text-amber-950 shadow-sm border-2 border-amber-500 scale-105";
                } else if (i < newStage) {
                    stepElem.className = "step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-emerald-100 text-emerald-800 border border-emerald-300 opacity-80";
                } else {
                    stepElem.className = "step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-100/60 text-amber-600/70";
                }
            }

            updateChecklistUI();

            if (newStage === 3) {
                setTimeout(() => {
                    playSound('victory');
                    triggerConfetti();
                    openVictoryModal();
                }, 600);
            }
        }

        function resetGame() {
            currentStage = 0;
            conditions.sun = false;
            conditions.air = false;
            conditions.water = false;

            document.getElementById('soil-surface').setAttribute('fill', '#B45309');
            updateSceneEffects();

            for (let i = 0; i < 4; i++) {
                const stageElem = document.getElementById(`plant-stage-${i}`);
                if (i === 0) {
                    stageElem.classList.remove('opacity-0', 'scale-75', 'pointer-events-none');
                    stageElem.classList.add('opacity-100', 'scale-100');
                } else {
                    stageElem.classList.remove('opacity-100', 'scale-100');
                    stageElem.classList.add('opacity-0', 'scale-75', 'pointer-events-none');
                }
            }

            for (let i = 0; i < 4; i++) {
                const stepElem = document.getElementById(`step-${i}`);
                if (i === 0) {
                    stepElem.className = "step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-400 text-amber-950 shadow-sm border-2 border-amber-500 scale-105";
                } else {
                    stepElem.className = "step-badge flex-1 text-center py-1.5 px-1 rounded-xl transition-all font-bold text-xs sm:text-sm bg-amber-100/60 text-amber-600/70";
                }
            }

            updateChecklistUI();
        }

        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnParticles(type) {
            const w = canvas.width;
            const h = canvas.height;

            if (type === 'sun') {
                for (let i = 0; i < 25; i++) {
                    particles.push({
                        x: w * 0.78 + (Math.random() - 0.5) * 40,
                        y: h * 0.18 + (Math.random() - 0.5) * 40,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3 + 1,
                        size: Math.random() * 6 + 3,
                        color: ['#FBBF24', '#F59E0B', '#FEF08A'][Math.floor(Math.random() * 3)],
                        alpha: 1,
                        life: 45
                    });
                }
            } else if (type === 'air') {
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: 20,
                        y: h * 0.3 + Math.random() * (h * 0.4),
                        vx: Math.random() * 7 + 5,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 6 + 3,
                        color: ['#06B6D4', '#67E8F9', '#CFFAFE'][Math.floor(Math.random() * 3)],
                        alpha: 1,
                        life: 45
                    });
                }
            } else if (type === 'water') {
                const startX = w * 0.58;
                const startY = h * 0.28;

                for (let i = 0; i < 35; i++) {
                    setTimeout(() => {
                        particles.push({
                            x: startX + (Math.random() - 0.5) * 12,
                            y: startY + (Math.random() - 0.5) * 10,
                            vx: -3.2 + (Math.random() - 0.5) * 1.5,
                            vy: Math.random() * 7 + 6,
                            size: Math.random() * 4 + 2.5,
                            color: ['#0284C7', '#38BDF8', '#60A5FA', '#93C5FD'][Math.floor(Math.random() * 4)],
                            alpha: 1,
                            life: 42
                        });
                    }, i * 25);
                }
            }
        }

        function triggerConfetti() {
            const w = canvas.width;
            const h = canvas.height;
            const colors = ['#FBBF24', '#34D399', '#60A5FA', '#F472B6', '#A78BFA'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: w / 2,
                    y: h / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.8) * 12,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    life: 90
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 1 / p.life;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        function openVictoryModal() {
            const modal = document.getElementById('victoryModal');
            const card = document.getElementById('victoryCard');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeVictoryModal() {
            const modal = document.getElementById('victoryModal');
            const card = document.getElementById('victoryCard');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
        }

        window.onload = function() {
            updateSceneEffects();
            updateChecklistUI();
        };
    </script>
</body>
</html>
